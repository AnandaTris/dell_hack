apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: carekaki
  labels:
    app: agent-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-service
  template:
    metadata:
      labels:
        app: agent-service
    spec:
      containers:
        - name: agent-service
          image: carekaki/agent-service:latest
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: carekaki-config
            - secretRef:
                name: carekaki-secrets
          env:
            - name: PORT
              value: "3002"
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
  namespace: carekaki
spec:
  selector:
    app: agent-service
  ports:
    - port: 3002
      targetPort: 3002
  type: ClusterIP
