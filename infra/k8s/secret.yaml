# Template — do NOT commit real keys. Apply with:
#   kubectl create secret generic carekaki-secrets \
#     --from-literal=ANTHROPIC_API_KEY=<your-key> \
#     -n carekaki
apiVersion: v1
kind: Secret
metadata:
  name: carekaki-secrets
  namespace: carekaki
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
