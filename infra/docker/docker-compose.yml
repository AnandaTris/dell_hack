version: "3.9"

networks:
  carekaki:
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: carekaki-postgres
    environment:
      POSTGRES_DB: carekaki
      POSTGRES_USER: carekaki
      POSTGRES_PASSWORD: carekaki
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - carekaki
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carekaki -d carekaki"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  profile-service:
    build:
      context: ../..
      dockerfile: services/profile-service/Dockerfile
    container_name: carekaki-profile-service
    ports:
      - "3003:3003"
    networks:
      - carekaki
    environment:
      PORT: "3003"
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  knowledge-service:
    build:
      context: ../..
      dockerfile: services/knowledge-service/Dockerfile
    container_name: carekaki-knowledge-service
    ports:
      - "3004:3004"
    networks:
      - carekaki
    environment:
      PORT: "3004"
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  agent-service:
    build:
      context: ../..
      dockerfile: services/agent-service/Dockerfile
    container_name: carekaki-agent-service
    ports:
      - "3002:3002"
    networks:
      - carekaki
    environment:
      PORT: "3002"
      NODE_ENV: production
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MOCK_MODE: ${MOCK_MODE:-false}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-4-7}
      PROFILE_SERVICE_URL: http://profile-service:3003
      KNOWLEDGE_SERVICE_URL: http://knowledge-service:3004
    depends_on:
      profile-service:
        condition: service_healthy
      knowledge-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: carekaki-web
    ports:
      - "3000:3000"
    networks:
      - carekaki
    environment:
      NODE_ENV: production
      AGENT_SERVICE_URL: http://agent-service:3002
      PROFILE_SERVICE_URL: http://profile-service:3003
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MOCK_MODE: ${MOCK_MODE:-false}
    depends_on:
      agent-service:
        condition: service_healthy
    restart: unless-stopped
