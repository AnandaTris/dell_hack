version: "3.9"

networks:
  carekaki:
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: carekaki-postgres
    environment:
      POSTGRES_DB: carekaki
      POSTGRES_USER: carekaki
      POSTGRES_PASSWORD: carekaki
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - carekaki
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carekaki -d carekaki"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

